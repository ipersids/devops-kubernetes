apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: logoutput-httproute
  namespace: exercises
spec:
  parentRefs:
    - name: shared-gateway
      namespace: exercises
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /logoutput
      backendRefs:
        - name: logoutput-svc
          port: 2345
