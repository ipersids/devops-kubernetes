name: Release application

on:
  push:
    branches:
      - "**"

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ secrets.GKE_PROJECT }}
  GKE_CLUSTER: dwk-cluster
  GKE_ZONE: europe-north1-b
  REGISTRY: europe-north1-docker.pkg.dev
  REPOSITORY: ipersids
  BRANCH: ${{ github.ref_name }}

jobs:
  build-publish-deploy:
    name: Build, Publish and Deploy
    runs-on: ubuntu-latest
    environment: GKE_PROJECT

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: "${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}"
          service_account: "${{ secrets.SERVICE_ACCOUNT }}"

      - name: "Set up Cloud SDK"
        uses: google-github-actions/setup-gcloud@v3

      - name: "Use gcloud CLI"
        run: gcloud info

      - run: gcloud --quiet auth configure-docker $REGISTRY

      - name: "Get GKE credentials"
        uses: "google-github-actions/get-gke-credentials@v3"
        with:
          cluster_name: "${{ env.GKE_CLUSTER }}"
          project_id: "${{ env.PROJECT_ID }}"
          location: "${{ env.GKE_ZONE }}"

      - name: "Form the image names"
        run: |
          echo "IMAGE_TAG_APP=$REGISTRY/$PROJECT_ID/$REPOSITORY/todoapp:$BRANCH-$GITHUB_SHA" >> $GITHUB_ENV
          echo "IMAGE_TAG_BACKEND=$REGISTRY/$PROJECT_ID/$REPOSITORY/todobackend:$BRANCH-$GITHUB_SHA" >> $GITHUB_ENV
          echo "IMAGE_TAG_CRON=$REGISTRY/$PROJECT_ID/$REPOSITORY/todocron:$BRANCH-$GITHUB_SHA" >> $GITHUB_ENV

      - name: Build App image
        working-directory: ./todo_app
        run: docker build --tag $IMAGE_TAG_APP .

      - name: Build Backend image
        working-directory: ./todo_backend
        run: docker build --tag $IMAGE_TAG_BACKEND .

      - name: Build Cron image
        working-directory: ./todo_cron
        run: docker build --tag $IMAGE_TAG_CRON .

      - name: Publish images
        run: |
          docker push $IMAGE_TAG_APP
          docker push $IMAGE_TAG_BACKEND
          docker push $IMAGE_TAG_CRON

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: "Create namespace"
        run: |
          if [ "$BRANCH" = "main" ]
          then
            echo "NAMESPACE=project" >> $GITHUB_ENV
          else
            echo "NAMESPACE=$BRANCH" >> $GITHUB_ENV
          fi
          kubectl create namespace $NAMESPACE || true

      - name: "Apply database access"
        if: github.ref_type == 'branch' && github.ref_name != 'main'
        run: |
          set -euo pipefail
          kubectl get secret todobackend-secret -n project -o json |
            jq --arg ns "$NAMESPACE" '{
              apiVersion: .apiVersion,
              kind: .kind,
              metadata: {
                name: .metadata.name,
                namespace: $ns
              },
              type: .type,
              data: .data
            }' |
            kubectl apply -f -

      - name: Deploy App
        run: |
          kubectl config set-context --current --namespace=$NAMESPACE
          kustomize edit set namespace $NAMESPACE
          kustomize edit set image $REPOSITORY/todoapp=$IMAGE_TAG_APP
          kustomize edit set image $REPOSITORY/todobackend=$IMAGE_TAG_BACKEND
          kustomize edit set image $REPOSITORY/todocron=$IMAGE_TAG_CRON
          kustomize build . | kubectl apply -f -
          kubectl rollout status deployment/todoapp-dep
          kubectl rollout status deployment/todobackend-dep
          kubectl get cronjob todo-cron
          kubectl get services -o wide
