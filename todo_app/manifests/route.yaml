apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: todo-httprout
  namespace: project
spec:
  parentRefs:
    - name: shared-gateway
      namespace: exercises
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: todoapp-svc
          port: 2346
